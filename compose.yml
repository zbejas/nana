services:
  nana:
    image: ghcr.io/zbejas/nana:latest
    container_name: nana
    ports:
      - "3000:3000"
    # PocketBase is bound to 127.0.0.1 inside the container. Never publish
    # 8090: it would bypass the app's auth, rate limits, and API surface.
    environment:
      - TZ=${TZ:-Europe/Ljubljana}
    volumes:
      - ./pocketbase/pb_data:/app/pocketbase/pb_data
    restart: unless-stopped
