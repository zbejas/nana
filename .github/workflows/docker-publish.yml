name: Build and Publish Docker Image

# Publishes the multi-arch production image. Runs when a GitHub Release is
# published, and is called by release.yml with the version it is about to
# release (a release created with GITHUB_TOKEN does not trigger workflows).
on:
    release:
        types: [published]
    workflow_call:
        inputs:
            version:
                description: "Version to publish (for example 0.2.1)"
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ inputs.version || github.event.release.tag_name }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.event.release.tag_name }}
                      type=semver,pattern={{major}},value=${{ inputs.version || github.event.release.tag_name }},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/Dockerfile
                  target: production
                  platforms: linux/amd64,linux/arm64
                  provenance: false
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
