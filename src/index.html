    THESIS: A quiet, precise writing workspace where graphite chrome, paper surfaces, and a single ember accent clear the way for the work. Refuses the card-stack dashboard and the orange-everywhere brand surface.
    OWN-WORLD: Paper and graphite neutrals, flat panels with one hairline, 6/10 px geometry, Geist Sans for every interface voice, Geist Mono only for code, restrained ember for action, focus, and selection.
    STORY: One calm workspace: find a note, move work, browse the library, ask the assistant, without the chrome shifting between rooms.
    FIRST VIEWPORT: Docked graphite sidebar; one shared page field; a single masthead hairline; content sits directly on the canvas; ember appears in the primary action, active marker, and focus.
    FORM: Unified workspace shell with a restrained document-first surface; user-pinned direction (Apple, Vercel, Notion/Obsidian).
